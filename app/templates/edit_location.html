{% extends 'base.html' %}{% block title %}Edit location{% endblock %}{% block content %}
<div class="page-head"><div><span class="eyebrow">ADMIN</span><h1>Edit {{ location.name }}</h1></div></div><form method="post" class="card form-card narrow"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Site name<input name="name" value="{{ location.name }}" required></label><label>Latitude<input name="latitude" type="number" step="any" value="{{ location.latitude }}" required></label><label>Longitude<input name="longitude" type="number" step="any" value="{{ location.longitude }}" required></label><label>Radius (m)<input name="radius_m" type="number" min="20" max="5000" value="{{ location.radius_m }}" required></label><div class="form-row"><label>Start<input name="start_time" type="time" value="{{ schedule.start_time.strftime('%H:%M') if schedule else '09:00' }}" required></label><label>End<input name="end_time" type="time" value="{{ schedule.end_time.strftime('%H:%M') if schedule else '18:00' }}" required></label></div><label>Grace minutes<input name="grace_minutes" type="number" min="0" max="120" value="{{ schedule.grace_minutes if schedule else 15 }}" required></label><fieldset><legend>Working days</legend><div class="day-list">{% for number, day in [(0,'Mon'),(1,'Tue'),(2,'Wed'),(3,'Thu'),(4,'Fri'),(5,'Sat'),(6,'Sun')] %}<label class="inline"><input type="checkbox" name="working_days" value="{{ number }}" {% if not schedule or number|string in schedule.working_days.split(',') %}checked{% endif %}> {{ day }}</label>{% endfor %}</div></fieldset><label class="inline"><input type="checkbox" name="active" {% if location.active %}checked{% endif %}> Active location</label><button class="button primary">Save location</button></form>
{% endblock %}
